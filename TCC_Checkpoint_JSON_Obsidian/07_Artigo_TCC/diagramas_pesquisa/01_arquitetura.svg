<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura experimental da escrita de memória GU-JSON</title>
  <desc id="desc">Uma transição SUMIE fornece o estado anterior de referência e a observação ao prompt fixo. Um dos três escritores gera o checkpoint completo. A saída bruta é registrada e avaliada contra o estado esperado, que não é mostrado ao escritor. A previsão não realimenta a próxima transição.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#51657c" stroke-width="1.5"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#172f49}.title{font-size:28px;font-weight:700}.head{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:15px}.line{fill:none;stroke:#51657c;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="650" rx="18" fill="#fff"/>
  <text x="40" y="46" class="small" fill="#52677b">01 / ARQUITETURA EXPERIMENTAL</text>
  <text x="40" y="85" class="title">Mesma transição. Três escritores. Um contrato de saída.</text>
  <rect x="40" y="120" width="1120" height="56" rx="10" fill="#172f49"/>
  <text x="600" y="155" text-anchor="middle" style="fill:#fff;font:17px Arial,sans-serif">Constantes: GU-JSON · schema · prompt zero-shot · saída ≤ 1.200 tokens · entradas SUMIE</text>
  <rect x="40" y="218" width="245" height="205" rx="12" fill="#edf4ff" stroke="#9bb6d7"/>
  <text x="60" y="252" class="head">Transição de entrada</text>
  <text x="60" y="291" class="body">M* anterior: referência</text>
  <text x="60" y="322" class="body">O atual: novo parágrafo</text>
  <text x="60" y="365" class="small">Mesma entidade e turno</text>
  <text x="60" y="389" class="small">para todos os escritores</text>
  <path d="M285 320 H325" class="line"/>
  <rect x="330" y="244" width="185" height="153" rx="12" fill="#f3f6fa" stroke="#adbccf"/>
  <text x="350" y="280" class="head">Prompt fixo</text>
  <text x="350" y="316" class="body">Schema + M* + O</text>
  <text x="350" y="350" class="small">Somente JSON</text>
  <text x="350" y="373" class="small">completo na saída</text>
  <path d="M515 320 H555" class="line"/>
  <rect x="560" y="204" width="300" height="232" rx="12" fill="#f3efff" stroke="#a99acb"/>
  <text x="580" y="239" class="head">Modelo escritor (variável)</text>
  <text x="580" y="279" class="body" font-weight="700">Qwen3-0.6B</text>
  <text x="580" y="301" class="small">Autoregressivo decoder-only</text>
  <text x="580" y="336" class="body" font-weight="700">T5Gemma B-B PrefixLM-IT</text>
  <text x="580" y="358" class="small">Encoder-decoder</text>
  <text x="580" y="393" class="body" font-weight="700">Qwen3-0.6B BD3LM</text>
  <text x="580" y="415" class="small">Difusão em blocos</text>
  <path d="M860 320 H900" class="line"/>
  <rect x="905" y="244" width="255" height="153" rx="12" fill="#eaf7f2" stroke="#88b9a7"/>
  <text x="925" y="280" class="head">Checkpoint gerado</text>
  <text x="925" y="316" class="body">M atual: JSON completo</text>
  <text x="925" y="350" class="small">Registrar saída bruta</text>
  <text x="925" y="373" class="small">antes de validar; sem reparo</text>
  <path d="M1032 397 V483" class="line"/>
  <rect x="40" y="488" width="475" height="78" rx="10" fill="#edf4ff" stroke="#9bb6d7"/>
  <text x="60" y="519" class="head">M* atual + anotações SUMIE</text>
  <text x="60" y="546" class="small">Referência de avaliação; não enviada ao escritor</text>
  <path d="M515 527 H555" class="line"/>
  <rect x="560" y="488" width="600" height="78" rx="10" fill="#eaf7f2" stroke="#88b9a7"/>
  <text x="580" y="519" class="head">Avaliação estrutural, semântica e por operação</text>
  <text x="580" y="546" class="small">Comparação pareada das mesmas transições e registro em JSONL</text>
  <text x="40" y="609" class="body">Próximo turno: carregar a próxima transição de referência, sem realimentar a previsão.</text>
  <text x="40" y="635" class="small">Fonte: elaborado pelo autor (2026), a partir do protocolo descrito no artigo. Não representa resultado experimental.</text>
</svg>
