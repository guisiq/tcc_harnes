<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1420" viewBox="0 0 1900 1420" role="img" aria-labelledby="title desc">
  <title id="title">Figura 1: visão geral do harness experimental para uma transição do SUMIE</title>
  <desc id="desc">Execução nas etapas i a iv: o SUMIE fornece a transição; apenas o estado anterior de referência e a observação seguem para o prompt fixo e para o escritor, única variável do experimento; a saída bruta é gravada sem reparo. Avaliação nas etapas v a ix: validação do JSON e do esquema, correspondência direta com a referência, juiz semântico local apenas para divergências e registro em JSON Lines, seguido da análise estatística.</desc>
